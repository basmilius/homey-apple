<!doctype html>
<html>
<head lang="en">
    <title>Mini Player</title>

    <link
        rel="stylesheet"
        href="style.css">
</head>

<body class="homey-widget">

<div
    class="player-background"
    id="background">
    <img
        id="background-img"
        src=""
        alt="">
</div>

<div class="player">
    <div class="player-top">
        <div
            class="player-artwork empty"
            id="artwork">
            <img
                id="artwork-img"
                src=""
                alt="">
            <svg
                class="artwork-placeholder"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 640 640">
                <path d="M499.7 70.8c7.8 6 12.3 15.3 12.3 25.2v96c0 14.7-10 27.5-24.2 31L384 249v215c0 53-50.1 96-112 96s-112-43-112-96 50.1-96 112-96c17.2 0 33.5 3.3 48 9.2V128c0-14.7 10-27.5 24.2-31l128-32c9.6-2.4 19.7-.2 27.5 5.8"/>
            </svg>
        </div>

        <div class="player-content">
            <div class="player-info">
                <div
                    class="player-track"
                    id="track">
                    &mdash;
                </div>

                <div
                    class="player-meta"
                    id="meta">
                    &mdash;
                </div>
            </div>

            <div
                class="player-controls"
                id="controls">
                <button
                    class="control-btn"
                    id="btn-prev"
                    title="Previous">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 640 640">
                        <path d="M491 100.8c-12.9-7-28.7-6.3-41 1.8L192 272.1V128c0-17.7-14.3-32-32-32s-32 14.3-32 32v384c0 17.7 14.3 32 32 32s32-14.3 32-32V367.9l258 169.6c12.3 8.1 28 8.8 41 1.8s21-20.5 21-35.2v-368c0-14.7-8.1-28.2-21-35.2z"/>
                    </svg>
                </button>

                <button
                    class="control-btn control-btn-play"
                    id="btn-play"
                    title="Play / Pause">
                </button>

                <button
                    class="control-btn"
                    id="btn-next"
                    title="Next">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 640 640">
                        <path d="M149 100.8c12.9-7 28.7-6.3 41 1.8l258 169.5V128c0-17.7 14.3-32 32-32s32 14.3 32 32v384c0 17.7-14.3 32-32 32s-32-14.3-32-32V367.9L190 537.5a39.97 39.97 0 0 1-62-33.5V136c0-14.7 8.1-28.2 21-35.2"/>
                    </svg>
                </button>

                <div class="control-spacer"></div>

                <button
                    class="control-btn control-btn-secondary"
                    id="btn-shuffle"
                    title="Shuffle">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 640 640">
                        <path d="M467.8 98.4c12-5 25.7-2.2 34.9 6.9l64 64c6 6 9.4 14.1 9.4 22.6s-3.4 16.6-9.4 22.6l-64 64a31.9 31.9 0 0 1-34.9 6.9c-12-5-19.8-16.5-19.8-29.4v-32h-32c-10.1 0-19.6 4.7-25.6 12.8L358 280l-40-53.3 21.2-28.3A95.9 95.9 0 0 1 416 160h32v-32c0-12.9 7.8-24.6 19.8-29.6M218 360l40 53.3-21.2 28.3A95.9 95.9 0 0 1 160 480H96c-17.7 0-32-14.3-32-32s14.3-32 32-32h64c10.1 0 19.6-4.7 25.6-12.8zm284.6 174.6a31.9 31.9 0 0 1-34.9 6.9c-12-5-19.7-16.6-19.7-29.5v-32h-32a95.9 95.9 0 0 1-76.8-38.4L185.6 236.8c-6-8.1-15.5-12.8-25.6-12.8H96c-17.7 0-32-14.3-32-32s14.3-32 32-32h64a95.9 95.9 0 0 1 76.8 38.4l153.6 204.8c6 8.1 15.5 12.8 25.6 12.8h32v-32c0-12.9 7.8-24.6 19.8-29.6s25.7-2.2 34.9 6.9l64 64c6 6 9.4 14.1 9.4 22.6s-3.4 16.6-9.4 22.6l-64 64z"/>
                    </svg>
                </button>

                <button
                    class="control-btn control-btn-secondary"
                    id="btn-repeat"
                    title="Repeat">
                </button>
            </div>
        </div>
    </div>

    <div
        class="player-progress"
        id="progress-container">
        <div class="progress-bar">
            <div
                class="progress-fill"
                id="progress-fill">
            </div>
        </div>

        <div
            class="progress-time"
            id="progress-time">
        </div>
    </div>

    <div
        class="player-volume"
        id="volume-container">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 640 640">
            <path d="M112 416h48l134.1 119.2c6.4 5.7 14.6 8.8 23.1 8.8 19.2 0 34.8-15.6 34.8-34.8V130.8c0-19.2-15.6-34.8-34.8-34.8-8.5 0-16.7 3.1-23.1 8.8L160 224h-48c-26.5 0-48 21.5-48 48v96c0 26.5 21.5 48 48 48m393.1-245a24 24 0 0 0-33.8 3.5 24 24 0 0 0 3.5 33.8C507.3 234.7 528 274.9 528 320s-20.7 85.3-53.2 111.8a24.1 24.1 0 0 0-3.5 33.8c8.3 10.3 23.5 11.8 33.8 3.5 43.2-35.2 70.9-88.9 70.9-149s-27.7-113.8-70.9-149zm-60.5 74.5a24 24 0 0 0-33.8 3.5 24 24 0 0 0 3.5 33.8A47.9 47.9 0 0 1 432 320c0 15-6.9 28.4-17.7 37.3a24.1 24.1 0 0 0-3.5 33.8c8.3 10.3 23.5 11.8 33.8 3.5 21.5-17.7 35.4-44.5 35.4-74.6a95.9 95.9 0 0 0-35.5-74.5z"/>
        </svg>

        <div
            class="volume-bar"
            id="volume-bar">
            <div
                class="volume-fill"
                id="volume-fill">
            </div>
        </div>
    </div>
</div>

<script type="text/javascript">
    function onHomeyReady(Homey) {
        const REALTIME_EVENT = 'apple-mini-player-update';

        const SVG_PLAY = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M187.2 100.9a40 40 0 0 0-39.6.7A39.9 39.9 0 0 0 128 136v368c0 14.1 7.5 27.2 19.6 34.4s27.2 7.5 39.6.7l336-184c12.8-7 20.8-20.5 20.8-35.1s-8-28.1-20.8-35.1z"/></svg>`;
        const SVG_PAUSE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M176 96c-26.5 0-48 21.5-48 48v352c0 26.5 21.5 48 48 48h64c26.5 0 48-21.5 48-48V144c0-26.5-21.5-48-48-48zm224 0c-26.5 0-48 21.5-48 48v352c0 26.5 21.5 48 48 48h64c26.5 0 48-21.5 48-48V144c0-26.5-21.5-48-48-48z"/></svg>`;
        const SVG_REPEAT_ALL = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M534.6 182.6a32.05 32.05 0 0 0 0-45.3l-64-64a31.9 31.9 0 0 0-34.9-6.9c-12 5-19.7 16.7-19.7 29.6v32H256c-106 0-192 86-192 192 0 17.7 14.3 32 32 32s32-14.3 32-32c0-70.7 57.3-128 128-128h160v32c0 12.9 7.8 24.6 19.8 29.6s25.7 2.2 34.9-6.9l64-64zM105.4 457.4a32.05 32.05 0 0 0 0 45.3l64 64c9.2 9.2 22.9 11.9 34.9 6.9S224 556.9 224 544v-32h160c106 0 192-86 192-192 0-17.7-14.3-32-32-32s-32 14.3-32 32c0 70.7-57.3 128-128 128H224v-32c0-12.9-7.8-24.6-19.8-29.6s-25.7-2.2-34.9 6.9l-64 64z"/></svg>`;
        const SVG_REPEAT_ONE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M534.6 137.4a32.05 32.05 0 0 1 0 45.3l-64 64a31.9 31.9 0 0 1-34.9 6.9c-12-5-19.7-16.7-19.7-29.6v-32H256c-70.7 0-128 57.3-128 128 0 17.7-14.3 32-32 32s-32-14.3-32-32c0-106 86-192 192-192h160V96c0-12.9 7.8-24.6 19.8-29.6s25.7-2.2 34.9 6.9l64 64zM105.4 502.6a32.05 32.05 0 0 1 0-45.3l64-64c9.2-9.2 22.9-11.9 34.9-6.9S224 403.1 224 416v32h160c70.7 0 128-57.3 128-128 0-17.7 14.3-32 32-32s32 14.3 32 32c0 106-86 192-192 192H224v32c0 12.9-7.8 24.6-19.8 29.6s-25.7 2.2-34.9-6.9l-64-64zM352 280v80c0 13.3-10.7 24-24 24s-24-10.7-24-24v-48c-10 0-19.4-6.4-22.8-16.4a24 24 0 0 1 15.2-30.4l24-8c7.3-2.4 15.4-1.2 21.6 3.3s10 11.8 10 19.5"/></svg>`;

        const settings = Homey.getSettings();
        const deviceIds = Homey.getDeviceIds();
        const deviceId = deviceIds.length > 0 ? deviceIds[0] : null;

        const background = document.getElementById('background');
        const backgroundImg = document.getElementById('background-img');
        const artwork = document.getElementById('artwork');
        const artworkImg = document.getElementById('artwork-img');
        const track = document.getElementById('track');
        const meta = document.getElementById('meta');
        const controls = document.getElementById('controls');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnShuffle = document.getElementById('btn-shuffle');
        const btnRepeat = document.getElementById('btn-repeat');
        const btnPlay = document.getElementById('btn-play');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const progressTime = document.getElementById('progress-time');
        const volumeContainer = document.getElementById('volume-container');
        const volumeBar = document.getElementById('volume-bar');
        const volumeFill = document.getElementById('volume-fill');

        let currentPosition = 0;
        let positionTimestamp = Date.now();
        let isPlaying = false;
        let currentDuration = 0;
        let currentShuffle = false;
        let currentRepeat = 'off';
        let progressInterval = null;
        let ready = false;
        let currentArtworkUrl = '';

        if (!settings.show_blurred_artwork) {
            background.style.display = 'none';
        }

        if (!settings.show_controls) {
            controls.style.display = 'none';
        }

        if (!settings.show_progress) {
            progressContainer.style.display = 'none';
        }

        if (!settings.show_volume) {
            volumeContainer.style.display = 'none';
        }

        function formatTime(totalSeconds) {
            if (totalSeconds == null || totalSeconds < 0) {
                return '';
            }

            const seconds = Math.floor(totalSeconds);
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;

            if (hours > 0) {
                return `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            return `${minutes}:${String(secs).padStart(2, '0')}`;
        }

        function tickProgress() {
            if (currentDuration <= 0) {
                progressFill.style.setProperty('--progress', '0%');
                progressTime.textContent = '';
                return;
            }

            let position = currentPosition;
            if (isPlaying) {
                const elapsed = (Date.now() - positionTimestamp) / 1000;
                position = Math.min(currentPosition + elapsed, currentDuration);
            }

            const pct = Math.min(100, (position / currentDuration) * 100);
            progressFill.style.setProperty('--progress', `${pct.toFixed(2)}%`);
            progressTime.textContent = `${formatTime(position)} / ${formatTime(currentDuration)}`;
        }

        function updateHeight() {
            const height = document.body.getBoundingClientRect().height;

            if (ready) {
                Homey.setHeight(height);
            } else {
                Homey.ready({height});
                ready = true;
            }
        }

        function updateBackground(url) {
            if (url === currentArtworkUrl) {
                return;
            }

            currentArtworkUrl = url;

            if (url) {
                backgroundImg.src = url;
                background.classList.add('has-image');
            } else {
                backgroundImg.src = '';
                background.classList.remove('has-image');
            }
        }

        function render(state) {
            clearInterval(progressInterval);
            progressInterval = null;

            if (!state) {
                track.textContent = '—';
                meta.textContent = deviceId ? '—' : Homey.__('widget.mini_player.no_device');
                artworkImg.src = '';
                updateBackground('');
                artwork.className = 'player-artwork empty';
                btnPlay.innerHTML = SVG_PLAY;
                btnPrev.disabled = false;
                btnNext.disabled = false;
                btnShuffle.classList.remove('active');
                btnShuffle.style.display = '';
                btnRepeat.classList.remove('active');
                btnRepeat.style.display = '';
                btnRepeat.innerHTML = SVG_REPEAT_ALL;
                isPlaying = false;
                currentPosition = 0;
                currentDuration = 0;
                progressFill.style.setProperty('--progress', '0%');
                progressTime.textContent = '';
                updateHeight();
                return;
            }

            track.textContent = state.track || '—';

            const artist = state.artist || '';
            const album = state.album || '';

            if (artist && album) {
                meta.textContent = `${artist} • ${album}`;
            } else {
                meta.textContent = artist || album || '—';
            }

            if (state.artworkUrl) {
                artworkImg.src = state.artworkUrl;
                artwork.className = 'player-artwork';
                updateBackground(state.artworkUrl);
            } else {
                artworkImg.src = '';
                artwork.className = 'player-artwork empty';
                updateBackground('');
            }

            isPlaying = Boolean(state.playing);
            btnPlay.innerHTML = isPlaying ? SVG_PAUSE : SVG_PLAY;

            const serverDelay = state.positionTimestamp
                ? Math.max(0, (Date.now() - state.positionTimestamp) / 1000)
                : 0;
            currentPosition = (state.position != null ? state.position : 0) + (isPlaying ? serverDelay : 0);
            positionTimestamp = Date.now();
            currentDuration = state.duration != null ? state.duration : 0;

            currentShuffle = Boolean(state.shuffle);
            currentRepeat = state.repeat || 'off';

            btnShuffle.classList.toggle('active', currentShuffle);

            if (state.repeat === 'one') {
                btnRepeat.innerHTML = SVG_REPEAT_ONE;
                btnRepeat.classList.add('active');
            } else if (state.repeat === 'all') {
                btnRepeat.innerHTML = SVG_REPEAT_ALL;
                btnRepeat.classList.add('active');
            } else {
                btnRepeat.innerHTML = SVG_REPEAT_ALL;
                btnRepeat.classList.remove('active');
            }

            const features = state.features || {};
            btnShuffle.style.display = features.shuffle === false ? 'none' : '';
            btnRepeat.style.display = features.repeat === false ? 'none' : '';
            btnPrev.disabled = features.previous === false;
            btnNext.disabled = features.next === false;

            if (state.volume != null) {
                volumeFill.style.setProperty('--volume', `${Math.round(state.volume * 100)}%`);
            }

            if (settings.show_progress !== false) {
                tickProgress();

                if (isPlaying && currentDuration > 0) {
                    progressInterval = setInterval(tickProgress, 1000);
                }
            }

            updateHeight();
        }

        artworkImg.addEventListener('error', function () {
            artworkImg.src = '';
            artwork.className = 'player-artwork empty';
        });

        async function init() {
            if (!deviceId) {
                render(null);
                return;
            }

            Homey.on(REALTIME_EVENT, function (state) {
                if (state && state.deviceId === deviceId) {
                    render(state);
                }
            });

            const state = await Homey.api('GET', `/${deviceId}`);
            render(state);
        }

        btnShuffle.addEventListener('click', async function () {
            if (!deviceId) {
                return;
            }

            try {
                Homey.hapticFeedback();
            } catch (_) {
            }

            currentShuffle = !currentShuffle;
            btnShuffle.classList.toggle('active', currentShuffle);

            await Homey.api('POST', `/${deviceId}/shuffle`, {shuffle: currentShuffle});
        });

        btnRepeat.addEventListener('click', async function () {
            if (!deviceId) {
                return;
            }

            try {
                Homey.hapticFeedback();
            } catch (_) {
            }

            const cycle = {off: 'all', all: 'one', one: 'off'};
            currentRepeat = cycle[currentRepeat] || 'off';

            if (currentRepeat === 'one') {
                btnRepeat.innerHTML = SVG_REPEAT_ONE;
                btnRepeat.classList.add('active');
            } else if (currentRepeat === 'all') {
                btnRepeat.innerHTML = SVG_REPEAT_ALL;
                btnRepeat.classList.add('active');
            } else {
                btnRepeat.innerHTML = SVG_REPEAT_ALL;
                btnRepeat.classList.remove('active');
            }

            await Homey.api('POST', `/${deviceId}/repeat`, {repeat: currentRepeat});
        });

        btnPrev.addEventListener('click', async function () {
            if (!deviceId || btnPrev.disabled) {
                return;
            }

            try {
                Homey.hapticFeedback();
            } catch (_) {
            }

            await Homey.api('POST', `/${deviceId}/previous`);
        });

        btnPlay.addEventListener('click', async function () {
            if (!deviceId) {
                return;
            }

            try {
                Homey.hapticFeedback();
            } catch (_) {
            }

            isPlaying = !isPlaying;
            btnPlay.innerHTML = isPlaying ? SVG_PAUSE : SVG_PLAY;

            await Homey.api('POST', `/${deviceId}/playing`);
        });

        btnNext.addEventListener('click', async function () {
            if (!deviceId || btnNext.disabled) {
                return;
            }

            try {
                Homey.hapticFeedback();
            } catch (_) {
            }

            await Homey.api('POST', `/${deviceId}/next`);
        });

        if (settings.show_volume !== false) {
            let volumeActive = false;
            let currentVolume = 0;

            volumeBar.addEventListener('pointerdown', function (e) {
                volumeActive = true;
                volumeBar.setPointerCapture(e.pointerId);
                volumeBar.classList.add('active');
                setVolumeFromPointer(e.clientX);
                e.preventDefault();
            });

            volumeBar.addEventListener('pointermove', function (e) {
                if (!volumeActive) {
                    return;
                }

                setVolumeFromPointer(e.clientX);
                e.preventDefault();
            });

            volumeBar.addEventListener('pointerup', async function (e) {
                if (!volumeActive) {
                    return;
                }

                volumeActive = false;
                volumeBar.releasePointerCapture(e.pointerId);
                volumeBar.classList.remove('active');
                setVolumeFromPointer(e.clientX);

                if (deviceId) {
                    await Homey.api(
                        'POST',
                        `/${deviceId}/volume`,
                        {volume: currentVolume}
                    );
                }

                e.preventDefault();
            });

            function setVolumeFromPointer(clientX) {
                const rect = volumeBar.getBoundingClientRect();
                currentVolume = Math.min(Math.max((clientX - rect.left) / rect.width, 0), 1);
                volumeFill.style.setProperty('--volume', `${Math.round(currentVolume * 100)}%`);
            }
        }

        init();
    }
</script>

</body>
</html>
